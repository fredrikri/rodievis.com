<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Rien ici | Fredrik Rodievis</title>
  <link rel="icon" href="/favicon.svg?v=rodievis-r1" type="image/svg+xml">
  <style>
    @font-face { font-family: "Jost"; src: url("/fonts/jost.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
    html, body { height: 100%; margin: 0; background: #141612; color: #e9e5d8; font-family: "Jost", Helvetica, Arial, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
    .word { position: relative; display: inline-block; font: 800 clamp(44px, 14vw, 150px)/1 "Jost", Helvetica, Arial, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #fffdf2; }
    .band { display: block; white-space: nowrap; }
    .band-top, .band-mid { position: absolute; inset: 0; }
    .band-top { clip-path: inset(0 0 61% 0); }
    .band-mid { clip-path: inset(41% 0 35% 0); transform: translateX(.06em); }
    .band-base { clip-path: inset(67% 0 0 0); }
    .word i { font-style: normal; display: inline-block; transform: scaleX(-1); }
    p { margin: 26px 0 34px; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: #acae9f; }
    a { display: inline-block; min-height: 44px; line-height: 42px; padding: 0 17px; color: #fffdf2; border: 1px solid rgb(233 229 216 / 25%); background: rgb(13 17 14 / 76%); text-decoration: none; font-size: 10px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <div>
      <span class="word" aria-label="Rien ici"><span class="band band-top" aria-hidden="true">Rien ic<i>i</i></span><span class="band band-mid" aria-hidden="true">Rien ic<i>i</i></span><span class="band band-base">Rien ic<i>i</i></span></span>
      <p>Toi, si.</p>
      <a href="/">Reviens voir le tableau</a>
    </div>
  </main>
</body>
</html>
